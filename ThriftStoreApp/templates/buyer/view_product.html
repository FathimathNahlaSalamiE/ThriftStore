{% extends 'base.html' %}
{% load static %}


{% block title %}
Product
{% endblock %}

{% block content %}






<h2>Pan</h2>


    <div class="d-flex flex-wrap ">

<div class="col-md-5">
                    <img src="{{ product.product_image.url }}" class="card-img-top" alt="">
</div>

                    <div class="card-body d-flex flex-wrap  flex-column col-md-7">
                        <h2 class="card-title">{{ product.product_name }}</h2>
                        <p class="card-text"><small class="text-body-secondary">{{ product.product_category }}</small></p>
                        <div class="desc-wrapper">
                            <p class="card-text description"> 
                            <span class="text-content">
                                {{ product.product_description }}
                            </span>
                        </p>
                        </div>
                        <p class="product-price card-text fw-bold"> AED {{ product.product_price }}</p>

                        <form action="{% url 'add_to_cart' product.id %}" method="post">
                            {% csrf_token %}

                            <!-- Quantity -->
<div class="d-flex flex-wrap  align-items-center justify-content-center gap-1">
    <button type="button"
            class="qty-btn"
            onclick="decreaseQty()">
        −
    </button>

    <input type="number"
           id="quantity"
           name="quantity"
           value="1"
           min="1"
           class="qty-input"
           readonly>

    <button type="button"
            class="qty-btn"
            onclick="increaseQty()">
        +
    </button>

</div>

                            
<h1 class="display- fw-bold  text-danger">
    Total:  AED <span id="total"></span>
</h1>
                            

                            <button class="edit-btn mt-3" type="submit">
                                <i class="fas fa-shopping-cart"></i>
                                Add to Cart
                            </button>
                        </form>
        
                    </div>
                
    </div>
<script>
const price = parseFloat("{{ product.product_price }}");

function updateTotal() {
    let qty = parseInt(document.getElementById("quantity").value);

    document.getElementById("total").textContent =
        (price * qty).toFixed(2);
}

function increaseQty() {
    let qty = document.getElementById("quantity");
    qty.value = parseInt(qty.value) + 1;
    updateTotal();
}

function decreaseQty() {
    let qty = document.getElementById("quantity");

    if (parseInt(qty.value) > 1) {
        qty.value = parseInt(qty.value) - 1;
        updateTotal();
    }
}

window.onload = updateTotal;
</script>

{% endblock %}
