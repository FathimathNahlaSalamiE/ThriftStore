{% extends 'base.html' %}
{% load static %}


{% block title %}
Product
{% endblock %}

{% block content %}

<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card shadow border-0">
                <div class="card-header bg-dark text-white text-center">
                    <h3>Delivery Address</h3>
                    <p class="mb-0">Please enter your shipping details</p>
                </div>

                <div class="card-body p-4">

                    <form method="POST">
                        {% csrf_token %}

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Full Name</label>
                                <input type="text"
                                       name="full_name"
                                       class="form-control"
                                       placeholder="Enter your full name"
                                       required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Phone Number</label>
                                <input type="tel"
                                       name="phone"
                                       class="form-control"
                                       placeholder="+971 50 123 4567"
                                       required>
                            </div>

                            <div class="col-12 mb-3">
                                <label class="form-label">House / Apartment</label>
                                <input type="text"
                                       name="house_name"
                                       class="form-control"
                                       placeholder="Flat No, Building Name"
                                       required>
                            </div>

                            <div class="col-12 mb-3">
                                <label class="form-label">Street Address</label>
                                <input type="text"
                                       name="street"
                                       class="form-control"
                                       placeholder="Street, Area"
                                       required>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">City</label>
                                <input type="text"
                                       name="city"
                                       class="form-control"
                                       placeholder="Dubai"
                                       required>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">State</label>
                                <input type="text"
                                       name="state"
                                       class="form-control"
                                       placeholder="UAE"
                                       required>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">Postal Code</label>
                                <input type="text"
                                       name="pincode"
                                       class="form-control"
                                       placeholder="00000">
                            </div>

                        </div>

                        <div class="text-end mt-4">
                            <button type="submit" class="btn btn-success btn-lg px-4">
                                Continue to Pay
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

{% endblock %}
