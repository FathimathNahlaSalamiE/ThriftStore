{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Thrift Store{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <h1><a style="text-decoration: none;color: #f3eded;" href="{% url 'home_page' %}">Thrift Store</a></h1>

        <nav>
            {% if request.user.role == 'seller' %}
            <a href="{% url 'seller_products' %}">Home</a>
            {% else %}
            <a href="{% url 'home_page' %}">Home</a>
            <a href="{% url 'cart_page' %}">Cart</a>
            <a href="{% url 'my_orders' %}">My Orders</a>
            {% endif %}
            
            <a href="{% url 'logout' %}">Logout</a>
        </nav>
    </header>


    <!-- PAGE CONTENT -->
    <main class="container mt-4">
        {% block content %}
        {% endblock %}
    </main>


    <!-- FOOTER -->
    <footer class="footer">
        <p>© 2026 Thrift Store</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
