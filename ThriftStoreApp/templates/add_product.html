{% extends 'base.html' %}
{% load static %}


{% block title %}
Seller Products
{% endblock %}

{% block content %}
    <h2>Add Products</h2>
    <a href="{% url 'seller_products' %}">Back to Home</a>
    <div>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{form.as_p}}
            <button type="submit">Add Product</button>
        </form>
    </div>
{% endblock %}
