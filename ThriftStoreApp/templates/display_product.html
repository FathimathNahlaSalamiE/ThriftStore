<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {% for i in product_list %}

    <p>{{i.product_name}}</p>
    <p>{{i.product_description}}</p>
    <p>{{i.product_category}}</p>
    <p>{{i.product_price}}</p>
    <img src="{{i.product_image.url}}" alt="">
    <p>{{i.product_seller}}</p>

    {% endfor %}
</body>
</html>
